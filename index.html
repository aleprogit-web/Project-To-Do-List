<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles/index.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

</head>
<body>
  <aside class="sidebar">
    <div class="to-do-title">
      <div class="to-do-header">
         <p class="title">To-Do List</p>
         <img class="heart-icon" src="images/heart.png">
      </div>
     
      <p class="subtitle">Organize suas tarefas <br>
      e seja mais produtivo!</p>
    </div>
    <section class="sidebar-options">
      <button class="option todas-option js-all-filter">
        <img class="todas-img" src="images/list.png">
        <span>Todas</span>
        <span class="task-number js-all-task-number"></span>
      </button>
      <button class="option js-pending-filter">
        <img class="pendentes-img" src="images/circle.png">
        <span>Pendentes</span>
        <span class="task-number js-pending-task-number"></span>
      </button>
      <button class="option js-checked-filter">
        <img class="concluidas-img" src="images/check.png">
        <span>Concluídas</span>
        <span class="task-number js-checked-task-number"></span>
      </button>
      <button class="option js-favorite-filter">
        <img class="favoritas-img" src="images/star.png">
        <span>Favoritas</span>
        <span class="task-number js-favorite-task-number"></span>
      </button>
    </section>

    <section class="daily-summary">
      <div class="summary-header">
        <p>Resumo do dia</p>
        <div class="summary-date">
          <button class="day-button js-previous-day">←</button>
          <span class="js-summary-date"></span>
          <button class="day-button js-next-day">→</button>
        </div>
      </div>
         

        <div class="summary-list">
          <p><span class="js-summary-total"></span> total</p>
          <p><span class="js-summary-checked"></span> concluídos</p>
          <p><span class="js-summary-pending"></span> pendentes</p>
        </div>
    </section>

    <img class="icon"src="images/open-book.png">
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-info">
        <p class="greeting">Olá<span class="name"></span>!</p>
        <p class="greeting-subtitle">Tenha um dia produtivo.</p>
      </div>

      <div class="header-buttons">
        <button class="mode-button js-mode-button">
          <img class="mode-icon"src="images/sun.png"></button>
        <button class="settings-button">
          <img src="images/settings.png"></button>
      </div>
    </header>

    <div class="div-input">
      <div class="task-input">
       <input class="input js-to-do-input" placeholder="O que você precisa fazer?">
       <button class="add-button js-add-button">+ Adicionar</button>
      </div>

      <div class="task-options">
        <img class="calendar-img" src="images/calendario.png">
        <span class="data-opcional-1">Data (opcional)</span>
        <input id="task-date" type="date" class="js-date-input">
      </div>
    </div>
    

    <div class="filters">
      <button class="filter-button day-filter"> 
        <img class="filters-icons calendar-img" src="images/calendario.png">Todas do dia
      </button>
      <button class="filter-button filter-option js-all-filter">
        <img class="filters-icons todas-img" src="images/list.png">Todas
      </button>
      <button class="filter-button filter-option js-pending-filter ">
        <img class="filters-icons pendentes-img" src="images/circle.png">Pendentes
      </button>
      <button class="filter-button filter-option js-checked-filter">
        <img class="filters-icons concluidas-img" src="images/check.png">Concluídas
      </button>
      
    </div>

    <section class="to-do-list"></section>

    <section class="edit-task">
      <div class="editar-tarefa">
        <p class="editar-title">Editar tarefa</p>
        <img class="close-editar" src="images/close.png">
      </div>
      <div class="tarefa-editar-div">
        <p class="tarefa">Tarefa</p>
        <input class="input-editar">
      </div>
      <div class="data-editar-div">
        <p class="data-opcional">Data(opcional)</p>
        <input class="input-editar" type="date">
      </div>
      <div>
        <button class="botao-cancelar">Cancelar</button>
        <button class="botao-salvar">Salvar alterações</button>
      </div>
    </section>

    <section class="settings">
      <div class="settings-container">
        <p class="settings-title">Configurações</p>
        <img class="close-settings" src="images/close-settings.png">
      </div>
      <div class="nome-div">
        <p class="seu-nome">Seu nome: </p>
        <input class="input-name">
      </div>
      <div class="tarefas-div">
        <p class="tarefas">Tarefas</p>
        <button class="settings-limpar">Limpar concluídas</button>
        <button class="settings-excluir">Excluir todas as tarefas</button>
      </div>
      <div>
        <button class="settings-cancelar">Cancelar</button>
        <button class="settings-salvar">Salvar alterações</button>
      </div>
    </section>
   
    
  </main>
  
  <script type="module" src="scripts/to-do.js"></script>
  <script src="scripts/pageMode.js"></script>
</body>
</html>
